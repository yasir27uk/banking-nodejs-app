# =============================================================================
# nginx.conf — Enterprise configuration for VMware VMC Console
# Non-root: listens on port 8080 | pid in /tmp | no root-owned paths
# =============================================================================

worker_processes  auto;

# pid must be writable by UID 101 (nginx user) — /tmp is writable
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept       on;
    use                epoll;
}

http {
    # ── Temp paths writable by UID 101 ───────────────────────────────────────
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # hide nginx version

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml font/woff font/woff2;

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"                     always;
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

        # ── Hashed static assets — cache aggressively ─────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires            1y;
            add_header         Cache-Control "public, immutable";
            try_files          $uri =404;
            access_log         off;
        }

        # ── Next.js static export SPA routing ────────────────────────────────
        location / {
            try_files $uri $uri/ $uri.html /index.html =404;
        }

        # ── Health endpoint (for HEALTHCHECK + k8s probes) ────────────────────
        location /healthz {
            access_log  off;
            return      200 "OK\n";
            add_header  Content-Type text/plain;
        }

        # ── Block hidden files (.git, .env, etc.) ─────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
